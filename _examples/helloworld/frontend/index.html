<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #121212;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1f2937;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            max-width: 420px;
            width: 100%;
        }
        input, button {
            width: 100%;
            margin-top: 1rem;
            padding: 0.9rem 1rem;
            border-radius: 12px;
            border: none;
        }
        input {
            background: #111827;
            color: #f8fafc;
            border: 1px solid #334155;
        }
        button {
            background: #22c55e;
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
        }
        pre {
            margin-top: 1rem;
            background: #0f172a;
            padding: 1rem;
            border-radius: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Hello World</h1>
        <p>Enter your name and call the Go backend.</p>

        <input id="name" type="text" placeholder="Type a name" value="Wails" />
        <button id="send">Say Hello</button>

        <div style="margin-top: 2rem; border-top: 1px solid #334155; padding-top: 1rem;">
            <h3>Native Features</h3>
            <button id="check-perm" style="background: #3b82f6; color: white;">Check Camera</button>
            <button id="request-perm" style="background: #8b5cf6; color: white;">Request Camera</button>
            <button id="ping" style="background: #64748b; color: white;">Ping Native Bridge</button>
        </div>

        <pre id="output">Result will show here.</pre>
    </div>
    <script src="wails.js"></script>
    <script src="app.js"></script>
</body>
</html>
