# hello-world sync configuration
# Use sync.sh to build the AAR and dump generated files into the Android template libs folder.

[build]
gomobile_target = android/arm64
androidapi = 21
package = github.com/its-ernest/wails-mobile/example
aar_name = helloworld.aar
output_dir = internal/templates/android/app/libs
clean_output = true

# Optional template sync values.
# If set, sync.sh will patch the Android template build.gradle minSdk/targetSdk values.
#template_min_sdk = 21
#template_target_sdk = 36

gomobile_flags = 
